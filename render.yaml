# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
# Runs the Dockerfile in Apple-preview mode on the free plan. The free plan has no
# persistent disk, so leaderboards reset whenever the service restarts or redeploys.
services:
  - type: web
    name: guessong
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MUSIC_PROVIDER
        value: apple
      - key: SESSION_SECRET
        generateValue: true
      # Optional: Spotify games for up to 5 friends (see README → Spotify games).
      # Render asks for these values; leave them empty to skip the feature.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
